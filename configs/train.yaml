# Main training / experiment config
# Laptop defaults (GTX 1650 4GB): batch 8, seq 32
# Design reference (paper-style): batch 16, seq 64

experiment_name: wm_metadrive_v0
seed: 0
device: cpu    # cuda | cpu; override with --device when needed

# Paths
paths:
  checkpoint_dir: checkpoints
  log_dir: logs
  buffer_dir: data/replay_buffer
  rollout_dir: data/raw_rollouts

# Logging
wandb:
  enabled: false
  project: worldmodel-metadrive
  entity: null

# Replay buffer
buffer:
  capacity: 100000        # increased: 25k too small, old episodes lost after ~25 iterations
  sequence_length: 32     # WM sample length (ref: 64; 32 = faster on 1650)
  term_ratio: 0.25        # 25% terminal sequence ratio to balance crash steps

# Bootstrap data collection (Phase A)
bootstrap:
  num_steps: 20000
  policy: random          # random | (later: ppo)
  save_every: 5000

# World Model offline training on bootstrap buffer (A5-A6)
wm_train:
  updates: 5000           # practical Phase A length with seq 32
  batch_size: 8           # ref: 16
  log_every: 20
  checkpoint_every: 500

# Actor-Critic trained from posterior states with differentiable RSSM imagination.
actor_critic:
  actor_hidden: [512, 512]
  critic_hidden: [512, 512]
  action_low: -1.0          # MetaDrive steering/throttle lower bound
  action_high: 1.0         # MetaDrive steering/throttle upper bound
  init_std: 0.5            # initial unsquashed Normal exploration std
  min_std: 0.30            # raised min_std to prevent policy entropy collapse
  max_std: 1.0
  imagination_horizon: 30  # extended horizon (~3.0s) so Actor sees crashes at step 35-50
  gamma: 0.997             # restored long-horizon discount (~333 steps) paired with DreamerV3 return normalization
  lambda: 0.95
  entropy_scale: 0.035     # tuned entropy scale to maintain exploration & avoid throttle saturation
  actor_lr: 3.0e-5         # stabilized learning rate for Actor
  critic_lr: 3.0e-5        # stabilized learning rate for Critic
  grad_clip: 10.0          # tight gradient clipping to prevent explosion
  updates: 10000
  batch_size: 8
  max_start_states: 64     # subsample B*T posteriors to cap imagination memory
  log_every: 20
  checkpoint_every: 500

# Online training loop (Phase B/C — stubs for now)
train:
  total_env_steps: 500000
  train_every: 1
  world_model_updates: 25
  actor_critic_updates: 25
  eval_every: 10000
  checkpoint_every: 20000

# Evaluation
eval:
  num_episodes: 20
  start_seed: 10000       # hold-out map seeds (unseen in train)
  deterministic: true
