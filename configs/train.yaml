# Main training / experiment config
# Laptop defaults (GTX 1650 4GB): batch 8, seq 32
# Design reference (paper-style): batch 16, seq 64

experiment_name: wm_metadrive_v0
seed: 0
device: cuda   # cuda | cpu

# Paths
paths:
  checkpoint_dir: checkpoints
  log_dir: logs
  buffer_dir: data/replay_buffer
  rollout_dir: data/raw_rollouts

# Logging
wandb:
  enabled: false
  project: worldmodel-metadrive
  entity: null

# Replay buffer
buffer:
  capacity: 25000         # laptop-friendly with 256x256 RGB (~4GB images)
  sequence_length: 32     # WM sample length (ref: 64; 32 = faster on 1650)

# Bootstrap data collection (Phase A)
bootstrap:
  num_steps: 20000
  policy: random          # random | (later: ppo)
  save_every: 5000

# World Model offline training on bootstrap buffer (A5-A6)
wm_train:
  updates: 5000           # practical Phase A length with seq 32
  batch_size: 8           # ref: 16
  log_every: 20
  checkpoint_every: 500

# Online training loop (Phase B/C — stubs for now)
train:
  total_env_steps: 500000
  train_every: 1
  world_model_updates: 1
  actor_critic_updates: 1
  eval_every: 10000
  checkpoint_every: 20000

# Evaluation
eval:
  num_episodes: 20
  start_seed: 10000       # hold-out map seeds (unseen in train)
  deterministic: true
