# Short diagnostic gate, not a validated high-performing policy recipe.
# Same architecture/data/reward as train.yaml; faster WM feedback, shorter imagination.
experiment_name: pilot_v3
seed: 0
device: cpu
paths:
  checkpoint_dir: checkpoints/pilot_v3
  log_dir: logs/pilot_v3
  buffer_dir: data/replay_buffer
wandb:
  enabled: false
buffer:
  capacity: 100000
  sequence_length: 32
  term_ratio: 0.25
  demo_ratio: 0.25
wm_train:
  batch_size: 8
actor_critic:
  actor_hidden: [512, 512]
  critic_hidden: [512, 512]
  action_low: -1.0
  action_high: 1.0
  init_std: 0.3
  min_std: 0.1
  max_std: 0.5
  mean_transform: tanh
  std_transform: sigmoid
  entropy_mode: squashed
  imagination_horizon: 15
  gamma: 0.997
  lambda: 0.95
  entropy_scale: 0.01
  actor_lr: 3.0e-5
  critic_lr: 3.0e-5
  grad_clip: 10.0
  max_start_states: 64
train:
  total_env_steps: 2000
  steps_per_iter: 250
  action_noise_std: 0.0
  world_model_updates: 25
  actor_critic_updates: 5
  eval_every: 1000
  checkpoint_every: 1000
eval:
  num_episodes: 4
  start_seed: 10000
  deterministic: true
